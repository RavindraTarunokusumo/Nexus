[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus"
version = "0.1.0"
description = "Nexus Lite — private intelligence ingestion and synthesis engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.5",
    "pydantic-settings>=2.2.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "trafilatura>=1.9.0",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",
    "langgraph>=0.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
nexus = "app.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
    "testcontainers[postgres]>=4.4.0",
    "ruff>=0.6.0",
    "pre-commit>=3.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle errors and warnings
# F:   pyflakes (unused imports/variables, undefined names)
# I:   isort (import ordering)
# C90: mccabe cyclomatic complexity (technical debt gate)
select = ["E", "W", "F", "I", "C90"]
# E501: line-too-long is already covered by line-length above; accept
# occasional overruns in docstrings/comments without breaking the build.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
# Functions with cyclomatic complexity above this are flagged as technical debt.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests can have longer fixture/seed functions and more local variables.
"tests/**" = ["C901"]
