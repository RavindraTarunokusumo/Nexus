[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus"
version = "0.1.0"
description = "Nexus Lite — private intelligence ingestion and synthesis engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.5",
    "pydantic-settings>=2.2.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "trafilatura>=1.9.0",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
nexus = "app.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
    "testcontainers[postgres]>=4.4.0",
    "ruff>=0.6.0",
    "pre-commit>=3.5.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "slow: marks tests requiring a running database (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle errors and warnings
# F:   pyflakes (unused imports/variables, undefined names)
# I:   isort (import ordering)
# C90: mccabe cyclomatic complexity (technical debt gate)
# B:   flake8-bugbear (common bugs and design issues)
# ASYNC: async-specific pitfalls (blocking calls in async, etc.)
# S:   bandit-equivalent security checks
select = ["E", "W", "F", "I", "C90", "B", "ASYNC", "S"]
# E501: line-too-long covered by line-length setting above.
# B008: typer.Option/Argument and FastAPI Depends() are intentional
#       function calls in default args — the library pattern, not a bug.
ignore = ["E501", "B008"]

[tool.ruff.lint.mccabe]
# Functions with cyclomatic complexity above this are flagged as technical debt.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Tests can have longer fixture/seed functions and more local variables.
# S101: assert is the standard assertion mechanism in pytest.
# S324: md5/sha1 used in test fixtures for deterministic IDs, not crypto.
# S603: subprocess calls in conftest for test infrastructure setup.
"tests/**" = ["C901", "S101", "S324", "S603"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
# warn_return_any is disabled: SQLAlchemy async query results are typed as
# Any — enabling it produces ~14 false positives without the SQLAlchemy
# mypy plugin.  Add sqlalchemy[mypy] to dev deps if stricter checks are wanted.
# Exclude test files — mypy type-checks app/ only at commit time.
exclude = ["tests/"]
