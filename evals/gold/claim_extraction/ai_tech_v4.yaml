  document_text: 'Anthropic released Claude 4 Opus on March 12, 2025, marking a significant milestone for the company. The new model features a 200K token context window and improved reasoning capabilities
    over its predecessor. Early benchmarks suggest it outperforms GPT-4o on several coding and analysis tasks.

    '
