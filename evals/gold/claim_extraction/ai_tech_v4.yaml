  document_text: 'A joint study by Stanford and CMU published in Science found that chain-of-thought prompting consistently improves reasoning on mathematical word problems by 15-40% compared to zero-shot
    baselines across six different LLM families. The effect was most pronounced for problems requiring more than three reasoning steps. The dataset and prompts were released publicly on GitHub.

    '
