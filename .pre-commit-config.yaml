# Pre-commit hooks for quality control and technical-debt prevention.
#
# Install once:  pre-commit install
# Run manually:  pre-commit run --all-files
#
# What this enforces:
#  - ruff lint (E, W, F, I, C90, B, ASYNC, S — CC ≤ 15, bugbear, async pitfalls, security)
#  - ruff format (consistent formatting, replaces black/isort)
#  - whitespace/EOF/YAML/TOML/large-file hygiene
#  - no direct commits to main
#  - private key / secret detection
#  - mypy type checking on app/
#  - fast unit tests (chunker + cli renderer) — no Docker required
#
# Pytest integration tests (testcontainers) run in CI only — too slow for commit.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (type check app/)
        entry: mypy app/
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest-fast
        name: pytest (fast unit tests only)
        entry: python -m pytest tests/test_chunker.py tests/test_cli_render.py -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
