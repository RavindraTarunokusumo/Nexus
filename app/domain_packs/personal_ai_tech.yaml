salience_policy:
  min_floor: 0.3
  preserve_if:
    - The text reports a concrete model, product, infrastructure, pricing, policy, security, funding, benchmark, research, or forecast change.
    - The text states a measurable performance, cost, capability, safety, or adoption result.
    - The text names affected systems, organizations, users, developers, jurisdictions, hardware, models, or products.
    - The text adds a limitation, caveat, uncertainty, or failure mode to a headline claim.
    - The text changes interpretation of prior AI ecosystem state.
  ignore_if:
    - The text is generic AI background with no new source-specific information.
    - The text contains promotional adjectives without concrete claim content.
    - The text repeats a previous statement within the same source without adding detail.
    - The text is a boilerplate safe-harbor or generic disclaimer unless tied to a specific forecast or risk.
    - The text is purely biographical or corporate boilerplate without AI-domain consequence.
  downgrade_if:
    - The claim is abstract-only and not supported later in the source.
    - The source is secondary and does not identify the primary announcement, report, or filing.
    - The claim lacks date, actor, metric, affected system, or context needed for durable retrieval.
    - The claim is a broad trend statement without a concrete evidence anchor.
  escalate_if:
    - Numeric benchmark, pricing, cost, or forecast values conflict within the source.
    - A benchmark result is chart-only and exact values matter.
    - A security incident affects secrets, user data, model weights, or critical infrastructure.
    - A regulation or policy claim has legal obligations but ambiguous affected actors.
    - A forecast is high-impact and lacks stated assumptions.
    - The source appears to overstate a capability beyond its evidence.

facet_policy:
  generic_facets:
    - people
    - orgs
    - places
    - dates
  domain_facets:
    - models
    - model_families
    - products
    - APIs
    - benchmarks
    - metrics
    - datasets
    - hardware
    - cloud_platforms
    - frameworks
    - licenses
    - jurisdictions
    - regulators
    - vulnerabilities
    - safety_levels
    - money
    - compute_units
    - modalities
    - availability_channels
  preserve_unknown_salient_terms: true
  canonicalization_required: false
  external_id_sources: []

relation_grammar:
  core_relations:
    - supports
    - contradicts
    - refines
    - qualifies
    - weakens
    - strengthens
    - explains
    - causes
    - duplicates
    - supersedes
    - insufficient_evidence
  domain_relations:
    - releases_model
    - updates_model
    - outperforms
    - underperforms
    - evaluates_on
    - uses_benchmark
    - improves_cost
    - increases_cost
    - expands_availability
    - restricts_availability
    - patches_vulnerability
    - introduces_obligation
    - changes_license
    - raises_funding
    - forecasts_capability
    - forecasts_cost
    - qualifies_capability_claim
    - supersedes_prior_release
  relation_constraints: {}
  escalation_rules:
    - A new version of the same model family may supersede prior release objects, but only when the source states replacement, deprecation, or successor status.
    - A benchmark result can support a capability claim only when task, metric, and evaluated model match.
    - A limitation, failure mode, or caveat should qualify related model capability, benchmark, or product claims.
    - A price reduction strengthens affordability/cost-efficiency thesis objects but should not imply adoption without evidence.
    - A safety disclosure can weaken deployment-readiness claims and support security-risk thesis objects.
    - A regulation can restrict_availability, introduce_obligation, or qualify product launch claims.

epistemic_policy:
  source_authority_rules:
    primary: Primary release note, paper, filing, law, regulator report, or vendor disclosure.
    secondary: Reputable article summarizing primary material.
    tertiary: Opinion, forecast, rumor, or unsourced aggregation.
    unknown: Source authority cannot be determined.
  status_rules:
    release_product_funding_pricing: asserted_by_source
    benchmark_and_research_results: asserted_by_source unless independent replication is present
    vulnerabilities_and_incidents: asserted_by_source; set uncertainty if details are unconfirmed
    forecasts: speculative or forward_looking
    enacted_regulations: asserted_by_source
    proposed_regulations: forward_looking
    opinionated_trend_claims: inferred only if the source explicitly argues the inference
  confidence_rules:
    raise_when:
      - source is primary
      - object has a direct quote or exact span evidence
      - benchmark includes task, metric, score, and model
      - pricing includes unit, old/new value, and effective date
      - regulation includes jurisdiction and affected actor
    lower_when:
      - source is secondary without primary link
      - claim is abstract-only
      - value is approximate or chart-derived
      - benchmark lacks setup details
      - forecast lacks assumptions
      - product availability is unclear
  contradiction_policy:
    first_action: Attempt to refine scope before marking contradiction; different benchmark, model size, date, modality, region, customer tier, or license may explain apparent conflict.
    supersession: If the same actor reports a newer value for the same object, mark older object superseded.
    high_authority_conflict: If two sources disagree on a security, regulation, benchmark, or pricing claim and both are high-authority, escalate to T3.
    rumor_handling: Do not resolve rumors against primary disclosures without preserving both evidence paths.
  uncertainty_policy:
    store_in: uncertainty field of epistemic block
    required_for: forecasts, unconfirmed security incidents, chart-derived benchmark values, proposals not yet enacted
  escalation_policy:
    escalate_to_t3:
      - cross-source contradictions on security, regulation, benchmark, or pricing
      - high-impact security or regulatory interpretation
      - benchmark conflicts where both sources appear high-authority
      - unclear forecasts with major downstream implications
    escalate_to_t4:
      - integrity audit
      - high-stakes deployment or safety decisions
      - major contradiction reports
      - domain-pack blind spot review

model_routing_policy:
  default_route:
    segmenting: T0
    basic_facets: T1
    semantic_compression_easy: T1
    semantic_compression_ambiguous: T2
    relation_classification_easy: T2
    synthesis: T3
    audit_or_high_impact: T4
  models:
    T1:
      extractor: GLiNER2-style NER extractor for facet and entity extraction
      embeddings: bge-small for dense retrieval and near-duplicate detection
      classifier: DeBERTa-xsmall for domain/topic classification
      fallback_lm: Qwen 0.5B for low-stakes compression and labeling
    T2: deepseek/deepseek-v4-flash
    T3: deepseek/deepseek-v4-pro

budgets:
  max_segments_per_source: 500
  max_semantic_objects_per_source: 80
  max_semantic_objects_per_segment: 5
  max_relations_per_object: 8
  max_facets_per_object: 24
  max_t2_calls_per_source: 20
  max_t3_calls_per_source: 2
  force_escalation_if_budget_exceeded: false
  per_source_type:
    ai_news_article:
      max_semantic_objects_per_source: 12
    model_release_note:
      max_semantic_objects_per_source: 25
    research_paper_or_report:
      max_semantic_objects_per_source: 80
    benchmark_report:
      max_semantic_objects_per_source: 60
    product_or_tool_announcement:
      max_semantic_objects_per_source: 25
    pricing_or_terms_update:
      max_semantic_objects_per_source: 20
    security_or_safety_disclosure:
      max_semantic_objects_per_source: 40
    policy_or_regulation_update:
      max_semantic_objects_per_source: 40
    funding_or_company_update:
      max_semantic_objects_per_source: 15
    forecast_or_opinion:
      max_semantic_objects_per_source: 25

retention_policy:
  hot_window_hours: 168
  warm_window_days: 45
  cold_after_days: 365
  archive_after_days: null
  decay_by_object_type:
    model_release: active until superseded or deprecated
    benchmark_result: active but qualified when later evaluations narrow conditions
    pricing_change: supersedes older pricing/availability objects
    forecast: stale after prediction window passes
    security_vulnerability: active until patched/mitigated, then qualified or confirmed
    law_or_rule_change: active until superseded, repealed, or replaced
    funding_round: historical event; salience cools but record is permanent
  refresh_triggers:
    - new primary source for the same model/system/event
    - supersession event detected from same actor
    - contradiction from high-authority source
  stale_conditions:
    - forecast prediction window has elapsed
    - pricing has been superseded by a newer announcement
    - product or model has been deprecated
  supersession_rules:
    - Same actor + same object + newer date = supersedes prior state_change or event
    - Explicit deprecation notice supersedes availability_change and product_launch objects

retrieval_policy:
  query_intents:
    what_changed:
      description: Retrieve the most recent high-salience events, state changes, security/regulatory updates, and pricing changes.
      retrieval_priorities:
        - model_system
        - product_tooling
        - economics_pricing
        - safety_security
        - policy_governance
    model_capability_summary:
      description: Summarize a model's capabilities, benchmarks, limitations, and safety findings.
      retrieval_priorities:
        - model_system
        - evaluation_evidence
        - research_knowledge
        - safety_security
    benchmark_comparison:
      description: Compare model or method performance across benchmarks and metrics.
      retrieval_priorities:
        - evaluation_evidence
        - model_system
        - research_knowledge
    product_or_tool_update:
      description: Retrieve product launches, feature releases, API changes, and deprecations.
      retrieval_priorities:
        - product_tooling
        - economics_pricing
        - model_system
    pricing_and_cost_change:
      description: Retrieve pricing, quota, license, and cost-efficiency changes.
      retrieval_priorities:
        - economics_pricing
        - product_tooling
        - infrastructure_compute
    infrastructure_capacity_update:
      description: Retrieve compute, chip, cloud, inference, and deployment infrastructure changes.
      retrieval_priorities:
        - infrastructure_compute
        - product_tooling
        - economics_pricing
    security_or_safety_risk:
      description: Retrieve vulnerabilities, incidents, misuse vectors, mitigations, and safety evaluations.
      retrieval_priorities:
        - safety_security
        - policy_governance
        - model_system
    regulatory_obligation:
      description: Retrieve laws, obligations, thresholds, enforcement mechanisms, and affected actors.
      retrieval_priorities:
        - policy_governance
        - safety_security
        - economics_pricing
    research_trend:
      description: Retrieve research findings, methods, limitations, reproducibility notes, and related benchmarks.
      retrieval_priorities:
        - research_knowledge
        - evaluation_evidence
        - model_system
    forecast_outlook:
      description: Retrieve predictions, timelines, market forecasts, capability forecasts, and uncertainty statements.
      retrieval_priorities:
        - forecast_outlook
        - economics_pricing
        - model_system
    company_strategy_or_funding:
      description: Retrieve funding rounds, acquisitions, partnerships, restructuring, and commercial strategy signals.
      retrieval_priorities:
        - economics_pricing
        - ecosystem_event
        - product_tooling
  hybrid_score_weights:
    semantic_similarity: 0.35
    domain_object_type_match: 0.20
    source_authority: 0.12
    recency: 0.12
    salience: 0.11
    relation_relevance: 0.07
    evidence_quality: 0.03
  retrieval_priorities: {}

context_assembly:
  include:
    - highest_salience_relevant_objects
    - counter_evidence_and_caveats
    - superseding_or_superseded_objects
    - source_refs_and_excerpts
    - epistemic_notes
  ordering: evidence_strength
  max_tokens_by_tier:
    T2: 2000
    T3: 8000
    T4: 12000

evaluation_contract:
  object_extraction_metrics:
    - semantic object schema validity
    - grounded object rate
    - salient object precision
    - salient object recall
    - unsupported object rate
    - MVP claim-type projection accuracy
  relation_metrics:
    - relation accuracy
    - contradiction recall
    - supersession accuracy
    - evidence sufficiency accuracy
  epistemic_metrics:
    - status assignment accuracy
    - confidence calibration
    - escalation recall on hard cases
    - overconfidence rate on forecasts and benchmarks
  retrieval_metrics:
    - relevant semantic object recall
    - counter-evidence inclusion
    - citation grounding rate
    - stale/superseded object handling
  minimum_thresholds:
    semantic_object_schema_validity: "> 95%"
    grounded_object_rate: "> 95%"
    unsupported_object_rate: "< 5%"
    mvp_claim_type_projection_accuracy: "> 90%"
    escalation_recall_on_hard_cases: "> 85%"
    citation_grounding_rate: "> 95%"

