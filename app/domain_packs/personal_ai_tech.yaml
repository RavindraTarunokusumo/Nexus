# personal_ai_tech.yaml — v3 purpose-grammar domain pack
# Telos-semantic extraction scheme for the Personal AI Technology Analyst domain.
# Legacy top-level keys (topics, claim_types, brief_sections, models) preserved
# at the bottom for back-compat until A6 cuts over.

metadata:
  pack_id: personal_ai_tech
  domain: personal_ai_tech
  version: 1.0.0
  description: >-
    Purpose-grammar domain pack for AI technology source material. Covers AI models,
    products, research, infrastructure, pricing, safety, policy, funding, and forecasts.
  supported_source_types:
    - ai_news_article
    - model_release_note
    - research_paper_or_report
    - benchmark_report
    - product_or_tool_announcement
    - pricing_or_terms_update
    - security_or_safety_disclosure
    - policy_or_regulation_update
    - funding_or_company_update
    - forecast_or_opinion
  default_language: en
  model_policy_version: nexus_tiers_v1
  owner: null

telos:
  primary_purposes:
    - Report AI model, product, research, infrastructure, policy, safety, or market changes.
    - Explain technical capabilities, constraints, costs, or tradeoffs.
    - Present evidence about model performance, reliability, risk, adoption, or economics.
    - Update expectations about AI ecosystem direction.
    - Surface risks, vulnerabilities, regulatory obligations, and operational constraints.
  secondary_purposes:
    - Promote a product, model, benchmark, company, or research agenda.
    - Frame a release as strategically important.
    - Compare products, models, or methods.
    - Influence developer, buyer, investor, or policy perception.
    - Recruit contributors, customers, developers, or ecosystem partners.
  anti_purposes:
    - Not all AI announcements are evidence of durable technical progress.
    - Not all benchmark claims are independently verified.
    - Not all product launches imply broad availability or production readiness.
    - Not all forecasts are neutral predictions; many are persuasion or positioning.
    - Not all safety or security claims prove actual safety, only reported controls or incidents.
  reader_goals:
    - Identify what changed.
    - Separate concrete facts from marketing or speculation.
    - Track models, products, infrastructure, pricing, benchmarks, research findings, safety issues, and regulation.
    - Preserve evidence for later grounded chat, briefs, comparisons, and trend analysis.
    - Detect contradictions, supersession, and stale claims as the AI ecosystem moves quickly.
  producer_incentives:
    - Promote a product, model, or company to target audiences.
    - Establish authority or thought leadership in the AI space.
    - Drive developer adoption, investor interest, or regulatory attention.
    - Signal safety or responsibility commitments.

source_type_profiles:
  ai_news_article:
    structural_features:
      - headline and byline
      - lead paragraph with the key event
      - quoted or paraphrased announcements
      - background context paragraphs
      - closing color or analyst commentary
    high_value_sections:
      - headline and lead paragraph
      - quoted announcement
      - concrete dates, numbers, model/product names
      - described impact, availability, pricing, regulation, or incident details
    low_value_sections:
      - generic background repeated across articles
      - unsupported market color
      - vague hype without specific event or evidence
    expected_semantic_families:
      - model_system
      - product_tooling
      - economics_pricing
      - safety_security
      - policy_governance
      - ecosystem_event
    default_processing_mode: balanced
    url_domains:
      - techcrunch.com
      - venturebeat.com
      - theverge.com
      - wired.com
      - arstechnica.com
    title_regex: []

  model_release_note:
    structural_features:
      - model name and version header
      - release date and provider attribution
      - capability summary
      - benchmark tables
      - license and availability section
      - safety and deployment notes
    high_value_sections:
      - model name/version
      - release date
      - provider
      - modality
      - context window
      - license/availability
      - benchmark tables
      - safety notes
      - deployment constraints
    low_value_sections:
      - generic marketing language
      - repeated capability lists without evidence
    expected_semantic_families:
      - model_system
      - evaluation_evidence
      - safety_security
    default_processing_mode: balanced
    url_domains:
      - openai.com/blog
      - anthropic.com/news
      - ai.meta.com
      - deepmind.com/blog
      - mistral.ai/news
    title_regex:
      - "releases (gpt|claude|gemini|llama|mistral)"
      - "model (card|release)"

  research_paper_or_report:
    structural_features:
      - abstract with contribution claims
      - introduction and motivation
      - method section
      - experiments and results tables
      - limitations and future work
      - appendices with supplementary data
    high_value_sections:
      - abstract contribution claims
      - method
      - experiments/results
      - benchmark tables
      - limitations
      - safety or failure analysis
    low_value_sections:
      - acknowledgements without research content
      - bibliography entries without inline annotation
    expected_semantic_families:
      - research_knowledge
      - evaluation_evidence
      - model_system
      - safety_security
    default_processing_mode: deep
    url_domains:
      - arxiv.org
      - openreview.net
      - papers.nips.cc
      - aclanthology.org
    title_regex: []

  benchmark_report:
    structural_features:
      - benchmark name and version header
      - evaluation setup description
      - results table with model comparisons
      - metric definitions
      - reproducibility and caveat notes
    high_value_sections:
      - benchmark name
      - metric
      - score
      - task/dataset
      - evaluation setup
      - baseline/comparison
      - reproducibility or caveat notes
    low_value_sections:
      - non-quantified qualitative commentary
      - redundant methodology boilerplate
    expected_semantic_families:
      - evaluation_evidence
      - model_system
      - research_knowledge
    default_processing_mode: deep
    url_domains: []
    title_regex:
      - "mmlu|hellaswag|gsm8k|humaneval|swe-?bench|truthfulqa"

  product_or_tool_announcement:
    structural_features:
      - product name and launch status header
      - key capabilities list
      - pricing or availability details
      - target user description
      - integration and limitation notes
    high_value_sections:
      - product name
      - launch or GA status
      - target users
      - key capability
      - pricing/availability
      - integration details
      - limitations
    low_value_sections:
      - generic developer-experience marketing
      - testimonials without factual claims
    expected_semantic_families:
      - product_tooling
      - model_system
      - economics_pricing
    default_processing_mode: balanced
    url_domains: []
    title_regex:
      - "launch(es|ing)?"
      - "(?-i)([Ii]ntroducing|[Aa]nnouncing) (?=[A-Z][a-z])"

  pricing_or_terms_update:
    structural_features:
      - pricing table or changelog
      - old vs new price comparison
      - effective date notice
      - affected models or API endpoints
      - license or terms change summary
    high_value_sections:
      - old price and new price
      - unit basis
      - effective date
      - affected product/model/API
      - license/terms restrictions
    low_value_sections:
      - generic promotional justification without numeric data
    expected_semantic_families:
      - economics_pricing
      - product_tooling
    default_processing_mode: balanced
    url_domains: []
    title_regex:
      - "price|pricing|cost (drop|cut|reduction)|free tier"

  security_or_safety_disclosure:
    structural_features:
      - affected system identifier
      - vulnerability or incident description
      - impact assessment
      - mitigation or patch status
      - disclosure date and severity label
    high_value_sections:
      - affected system
      - vulnerability or risk type
      - exploit/misuse condition
      - impact
      - mitigation status
      - disclosure date
      - severity/caveats
    low_value_sections:
      - unrelated product marketing
      - generic security advice unrelated to the specific incident
    expected_semantic_families:
      - safety_security
      - policy_governance
      - model_system
    default_processing_mode: deep
    url_domains:
      - nvd.nist.gov
      - cve.org
    title_regex:
      - "cve-\\d{4}-\\d+"
      - "vulnerability|prompt injection|jailbreak|disclosure"

  policy_or_regulation_update:
    structural_features:
      - jurisdiction or regulator header
      - effective date and scope
      - obligation or prohibition text
      - enforcement mechanism
      - affected actor or threshold definition
    high_value_sections:
      - jurisdiction or regulator
      - effective date
      - obligation
      - affected actors or model classes
      - enforcement mechanism
      - thresholds such as FLOPs, risk level, or deployment category
    low_value_sections:
      - non-binding editorial commentary
      - background history without new obligation content
    expected_semantic_families:
      - policy_governance
      - safety_security
      - economics_pricing
    default_processing_mode: balanced
    url_domains:
      - whitehouse.gov
      - europa.eu
      - gov.uk
    title_regex:
      - "regulation|directive|executive order|EU AI Act"

  funding_or_company_update:
    structural_features:
      - company name and announcement header
      - funding amount or deal terms
      - investor or acquirer names
      - strategic rationale
      - date and operational consequence
    high_value_sections:
      - company
      - amount/valuation
      - investors/acquirer/partner
      - date
      - strategic use of funds or operational consequence
    low_value_sections:
      - boilerplate investor relations language
      - unverified market speculation
    expected_semantic_families:
      - economics_pricing
      - ecosystem_event
    default_processing_mode: balanced
    url_domains: []
    title_regex:
      - "series [a-d]|raises \\$|valuation|acquisition|acquires"

  forecast_or_opinion:
    structural_features:
      - forecaster identification
      - forecast target and timeframe
      - magnitude and direction claims
      - stated assumptions and uncertainty
      - caveat or confidence qualification
    high_value_sections:
      - forecaster
      - forecast target
      - timeframe
      - magnitude
      - assumptions
      - uncertainty or caveat
    low_value_sections:
      - unsupported hyperbole without stated assumptions
      - vague sentiment without forecast target
    expected_semantic_families:
      - forecast_outlook
      - economics_pricing
      - model_system
    default_processing_mode: balanced
    url_domains:
      - epoch.ai
      - metaculus.com
    title_regex:
      - "forecast|prediction|outlook for|by 20[3-9]\\d"

semantic_object_families:
