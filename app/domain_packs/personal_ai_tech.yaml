      - model_update
      - capability_claim
      - limitation_claim
      - availability_change
      - license_or_access_change
      - modality_support
    core_type_mapping:
      model_release: event
      model_update: event
      capability_claim: claim
      limitation_claim: constraint
      availability_change: state_change
      license_or_access_change: state_change
      modality_support: definition
    mvp_claim_type:
      model_release: model_release
      model_update: model_release
      modality_support: model_release
      availability_change: product_launch
      license_or_access_change: other
      capability_claim: research_finding
      limitation_claim: other
    required_fields:
      - provider or organization
      - model/system name
      - release/update status
      - date or relative timing when present
      - source refs

  evaluation_evidence:
